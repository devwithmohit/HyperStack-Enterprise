# ── Namespace (apply separately or add to kustomize base) ────────────────────
# kubectl create namespace hyperstack
# ---
# apiVersion: v1
# kind: Namespace
# metadata:
#   name: hyperstack

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyperstack-enterprise
  namespace: hyperstack
  labels:
    app.kubernetes.io/name:       hyperstack-enterprise
    app.kubernetes.io/component:  api
    app.kubernetes.io/part-of:    hyperstack
    app.kubernetes.io/managed-by: kubectl
  annotations:
    # Triggers a rolling restart when the ConfigMap/Secret hash changes
    # (set by CI: kubectl annotate deployment … rollout-hash="$GIT_SHA")
    deployment.kubernetes.io/revision: "1"
spec:
  # Baseline replicas — HPA will scale this between minReplicas and maxReplicas.
  replicas: 3

  selector:
    matchLabels:
      app.kubernetes.io/name:      hyperstack-enterprise
      app.kubernetes.io/component: api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      # At most 1 pod unavailable during a rollout
      maxUnavailable: 1
      # Surge 1 extra pod so traffic is never dropped during deployment
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name:      hyperstack-enterprise
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of:   hyperstack
      annotations:
        # Restart pods when the secret content changes (hash injected by CI)
        checksum/secret: "placeholder-replace-with-secret-hash-in-ci"
    spec:
      # ── Security context (pod-level) ────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser:    1001
        runAsGroup:   1001
        fsGroup:      1001

      # ── Graceful shutdown: give the app time to drain in-flight requests ────
      terminationGracePeriodSeconds: 60

      # ── Topology spread: distribute pods across nodes/zones ────────────────
      topologySpreadConstraints:
        - maxSkew:           1
          topologyKey:       kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hyperstack-enterprise
        - maxSkew:           1
          topologyKey:       topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hyperstack-enterprise

      # ── Init container: wait for Postgres to be ready before starting ───────
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL…"
              until nc -z "$POSTGRES_HOST" "$POSTGRES_PORT"; do
                echo "  postgres not ready — retrying in 2s"
                sleep 2
              done
              echo "PostgreSQL is ready ✔"
          env:
            - name:  POSTGRES_HOST
              value: "postgres-service"       # update to your PG service name
            - name:  POSTGRES_PORT
              value: "5432"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   true
            capabilities:
              drop: ["ALL"]

      # ── Main container ───────────────────────────────────────────────────────
      containers:
        - name:  hyperstack-enterprise
          image: ghcr.io/your-org/hyperstack-enterprise:latest
          # Always pull in production to pick up security patches.
          # Use IfNotPresent for dev/staging to save bandwidth.
          imagePullPolicy: Always

          ports:
            - name:          http
              containerPort: 3000
              protocol:      TCP

          # ── Environment — non-sensitive ────────────────────────────────────
          env:
            - name:  NODE_ENV
              value: "production"
            - name:  PORT
              value: "3000"
            - name:  HOST
              value: "0.0.0.0"
            - name:  LOG_LEVEL
              value: "info"

            # Downward API — exposes pod identity for distributed tracing
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

          # ── Environment — sensitive (pulled from K8s Secret) ───────────────
          envFrom:
            - secretRef:
                name: hyperstack-enterprise-secrets
                # Secret must contain:
                #   DATABASE_URL, REDIS_HOST, REDIS_PORT

          # ── Resource requests & limits ─────────────────────────────────────
          # Requests  = what the scheduler uses for bin-packing.
          # Limits    = hard ceiling; exceeding memory → OOMKilled.
          # Tune these based on your load-test results.
          resources:
            requests:
              cpu:    "250m"       # 0.25 vCPU guaranteed
              memory: "256Mi"
            limits:
              cpu:    "1000m"      # burst up to 1 vCPU
              memory: "512Mi"      # hard cap — avoids noisy-neighbour OOM

          # ── Liveness probe ─────────────────────────────────────────────────
          # Kubernetes restarts the container if this fails consecutively.
          # Fires AFTER startupProbe succeeds.
          livenessProbe:
            httpGet:
              path:   /health
              port:   http
              scheme: HTTP
            initialDelaySeconds: 0    # startupProbe guards the startup window
            periodSeconds:       15
            timeoutSeconds:      5
            failureThreshold:    3    # restart after 3 × 15 s = 45 s of failure
            successThreshold:    1

          # ── Readiness probe ────────────────────────────────────────────────
          # Pod is removed from Service endpoints while this fails.
          # More lenient than liveness — a momentary DB hiccup shouldn't kill pods.
          readinessProbe:
            httpGet:
              path:   /health
              port:   http
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds:       10
            timeoutSeconds:      3
            failureThreshold:    5    # tolerate 50 s of unreadiness before evicting
            successThreshold:    1

          # ── Startup probe ──────────────────────────────────────────────────
          # Gives the app up to 60 s to start (Prisma migrations, Redis connect)
          # before liveness kicks in. Prevents premature restarts during cold start.
          startupProbe:
            httpGet:
              path:   /health
              port:   http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds:       5
            timeoutSeconds:      3
            failureThreshold:    12   # 12 × 5 s = 60 s budget
            successThreshold:    1

          # ── Container security context ─────────────────────────────────────
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem:   true
            capabilities:
              drop: ["ALL"]

          # ── Writable tmp for pino-pretty / tsx cache in dev ───────────────
          volumeMounts:
            - name:      tmp-dir
              mountPath: /tmp

      volumes:
        - name: tmp-dir
          emptyDir: {}

      # ── Image pull secret (if using a private registry) ───────────────────
      # imagePullSecrets:
      #   - name: ghcr-credentials
